[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "async-llm-manager"
version = "1.0.0"
description = "Pre-entrega 1: clientes asíncronos de LLM, validación y streaming"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["openai>=2,<4", "anthropic>=0.70,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools]
py-modules = ["schemas", "manager", "probar_streaming"]
